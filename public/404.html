<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Page not found — WildcatSage</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600&family=Public+Sans:wght@400;600&family=DM+Mono:wght@400;500&display=swap"
        rel="stylesheet">

    <!-- Served at arbitrary paths, so every reference here is root-absolute. -->
    <link rel="stylesheet" href="/styles/reset.css">
    <link rel="stylesheet" href="/styles/design-system.css">

    <link rel="icon" href="/favicon.ico" sizes="any">
    <link rel="apple-touch-icon" href="/logo192.png">

    <!-- Apply theme early to prevent flash -->
    <script>
        (function () {
            const theme = localStorage.getItem('chatsage-theme') ||
                (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
            if (theme === 'dark') {
                document.documentElement.setAttribute('data-theme', 'dark');
            }
        })();
    </script>

    <script src="https://app.rybbit.io/api/script.js" data-site-id="107" defer></script>
</head>

<body>
    <main class="wc-stage wc-stage--transient">
        <div class="wc-frame">
            <div class="wc-frame-head">
                <span class="wc-lockup">Wildcat<b>Sage</b></span>
                <span class="wc-readout">404</span>
            </div>

            <div class="wc-frame-body">
                <div class="wc-bignum" aria-hidden="true">404</div>
                <h1 class="wc-title wc-title--sm">Page not found</h1>
                <p class="wc-lede">This URL is not part of this website. Make sure that the URL is correct, or return to the sign-in page.</p>
                <a href="/index.html" class="wc-btn wc-btn--ghost">Return to sign-in</a>
            </div>

            <div class="wc-frame-foot">
                <a class="wc-link" href="https://docs.wildcat.chat/botcommands.html" target="_blank" rel="noopener">Documentation</a>
                <span>bot.wildcat.chat</span>
            </div>
        </div>
    </main>
</body>

</html>

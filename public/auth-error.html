<!DOCTYPE html>
<html lang="en" data-i18n-manual>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WildcatSage - Authentication Error</title>

    <link rel="icon" href="/favicon.ico" sizes="any">
    <link rel="apple-touch-icon" href="/logo192.png">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preload" as="style"
        href="https://fonts.googleapis.com/css2?family=Archivo:wght@400..700&family=Public+Sans:wght@400..700&family=DM+Mono:wght@400;500&display=swap">
    <link
        href="https://fonts.googleapis.com/css2?family=Archivo:wght@400..700&family=Public+Sans:wght@400..700&family=DM+Mono:wght@400;500&display=swap"
        rel="stylesheet" media="print" onload="this.media='all'">
    <noscript>
        <link
            href="https://fonts.googleapis.com/css2?family=Archivo:wght@400..700&family=Public+Sans:wght@400..700&family=DM+Mono:wght@400;500&display=swap"
            rel="stylesheet">
    </noscript>

    <!-- Custom overrides -->
    <link rel="stylesheet" href="styles/custom.css">
    <link rel="stylesheet" href="styles/design-system.css">

    <!-- Apply theme early to prevent flash -->
    <script>
        (function () {
            const theme = localStorage.getItem('chatsage-theme') ||
                (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
            if (theme === 'dark') {
                document.documentElement.setAttribute('data-theme', 'dark');
            }
        })();
    </script>

    <script src="https://app.rybbit.io/api/script.js" data-site-id="107" defer></script>
</head>

<body>
    <a href="#main-content" class="wc-skip-link" data-i18n="common.skipToContent">Skip to main content</a>
    <main id="main-content" class="wc-stage wc-stage--transient">
        <div class="wc-frame">
            <div class="wc-frame-head">
                <span class="wc-lockup">Wildcat<b>Sage</b></span>
                <span class="wc-readout wc-readout--danger" id="error-readout" data-i18n="page.readout">Auth failed</span>
            </div>

            <div class="wc-frame-body">
                <h1 id="error-title" class="wc-title wc-title--sm" data-i18n="page.title">Authentication failed</h1>
                <p class="wc-lede" id="error-message-details" data-i18n="page.defaultMessage">An error occurred during Twitch authentication.</p>

                <div class="wc-code" id="error-code-block">
                    <span class="wc-code-label" data-i18n="page.errorLabel">Error</span>
                    <span class="wc-code-value" id="error-code" data-i18n="page.unknownCode">unknown</span>
                </div>

                <a href="index.html" class="wc-btn" id="error-action" data-i18n="page.tryAgain">Try again</a>
            </div>

            <div class="wc-frame-foot">
                <a class="wc-link" href="https://parfaitfair.com/#contact" target="_blank" rel="noopener" data-i18n="common.requestAccess">Request access</a>
                <span>bot.wildcat.chat</span>
            </div>
        </div>
    </main>

    <script type="module">
        import { t, initI18n } from '/js/i18n.js';

        // Display error details from URL parameters
        document.addEventListener('DOMContentLoaded', async () => {
            // Catalog first: everything below writes final text, so translating afterwards
            // would only overwrite it with the markup defaults.
            await initI18n();

            const params = new URLSearchParams(window.location.search);
            const error = params.get('error');
            const errorDescription = params.get('error_description');
            const errorMessageEl = document.getElementById('error-message-details');
            const errorTitleEl = document.getElementById('error-title');
            const errorCodeEl = document.getElementById('error-code');

            if (errorCodeEl) {
                errorCodeEl.textContent = error || t('page.unspecifiedCode', {}, 'unspecified');
            }

            // Cancelling is a choice, not a failure. Twitch reports it as
            // access_denied with "The user denied you access" — machine wording
            // from our side of the transaction — so this page drops the failure
            // framing entirely rather than accusing someone of denying us.
            const wasCanceled = error === 'access_denied';

            if (wasCanceled) {
                document.title = t('page.canceledTitle', {}, 'WildcatSage - Sign-in canceled');

                const readoutEl = document.getElementById('error-readout');
                if (readoutEl) {
                    readoutEl.textContent = t('page.canceledReadout', {}, 'Canceled');
                    readoutEl.classList.remove('wc-readout--danger');
                }

                // The error code is noise when nothing went wrong.
                const codeBlockEl = document.getElementById('error-code-block');
                if (codeBlockEl) codeBlockEl.remove();

                const actionEl = document.getElementById('error-action');
                if (actionEl) actionEl.textContent = t('page.returnToSignIn', {}, 'Return to sign-in');
            }

            // URLSearchParams has already decoded these. Decoding a second time
            // throws URIError on any literal "%" in the text, which would halt
            // this script and leave the page blank.
            if (errorMessageEl) {
                let message = '';
                if (wasCanceled) {
                    message = t('page.canceledMessage', {}, 'No changes were made. You can sign in when you are ready.');
                } else if (errorDescription) {
                    // Supplied by Twitch, so it arrives in whatever language Twitch used.
                    message = errorDescription;
                } else if (error) {
                    message = t('page.twitchError', {}, 'Twitch returned an error during authentication.');
                } else {
                    message = t('page.unspecifiedError', {}, 'An unspecified error occurred.');
                }
                errorMessageEl.textContent = message;

                // Append a clickable "Contact Me" link for not_authorized errors
                if (error === 'not_authorized') {
                    errorMessageEl.appendChild(document.createTextNode(' '));
                    const link = document.createElement('a');
                    link.href = 'https://parfaitfair.com/#contact';
                    link.target = '_blank';
                    link.rel = 'noopener';
                    link.textContent = t('common.contactMe', {}, 'Contact Me');
                    link.style.textDecoration = 'underline';
                    errorMessageEl.appendChild(link);
                }
            }

            if (errorTitleEl && error === 'access_denied') {
                errorTitleEl.textContent = t('page.canceledTitleHeading', {}, 'Sign-in canceled');
            }
        });
    </script>
</body>

</html>

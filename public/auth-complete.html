<!DOCTYPE html>
<html lang="en" data-i18n-manual>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WildcatSage - Sign-in</title>

    <link rel="icon" href="/favicon.ico" sizes="any">
    <link rel="apple-touch-icon" href="/logo192.png">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preload" as="style"
        href="https://fonts.googleapis.com/css2?family=Archivo:wght@400..700&family=Public+Sans:wght@400..700&family=DM+Mono:wght@400;500&display=swap">
    <link
        href="https://fonts.googleapis.com/css2?family=Archivo:wght@400..700&family=Public+Sans:wght@400..700&family=DM+Mono:wght@400;500&display=swap"
        rel="stylesheet" media="print" onload="this.media='all'">
    <noscript>
        <link
            href="https://fonts.googleapis.com/css2?family=Archivo:wght@400..700&family=Public+Sans:wght@400..700&family=DM+Mono:wght@400;500&display=swap"
            rel="stylesheet">
    </noscript>

    <!-- Custom overrides -->
    <link rel="stylesheet" href="styles/reset.css">
    <link rel="stylesheet" href="styles/design-system.css">

    <!-- Apply theme early to prevent flash -->
    <script>
        (function () {
            const theme = localStorage.getItem('chatsage-theme') ||
                (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
            if (theme === 'dark') {
                document.documentElement.setAttribute('data-theme', 'dark');
            }
        })();
    </script>

    <!-- Runs first, synchronously, and stays above the analytics loader below.
         The callback hands this page a one-time exchange code in the query
         string (and, for anyone mid-flow across the deploy, possibly still a
         session JWT). The analytics script is fetched before DOMContentLoaded,
         so its request would carry whichever of those is in the URL as its
         Referer. Take both out of the URL here and pass them on in memory. -->
    <script>
        (function () {
            var params = new URLSearchParams(window.location.search);
            var token = params.get('session_token');
            var code = params.get('code');
            if (!token && !code) return;

            if (token) {
                window.__sessionToken = token;
                params.delete('session_token');
            }
            if (code) {
                window.__exchangeCode = code;
                params.delete('code');
            }

            var query = params.toString();
            window.history.replaceState({}, '',
                window.location.pathname + (query ? '?' + query : '') + window.location.hash);
        })();
    </script>

    <script>
        // Spam domain blocker
        const spamDomains = [
            "sigr.io",
            "semalt.com",
            "buttons-for-website.com",
            "4webmasters.org",
        ];

        const referrer = document.referrer;
        let isSpam = false;

        for (const spamDomain of spamDomains) {
            if (referrer.includes(spamDomain)) {
                isSpam = true;
                break;
            }
        }

        if (!isSpam) {
            const rybbitScript = document.createElement("script");
            rybbitScript.src = "https://app.rybbit.io/api/script.js";
            rybbitScript.dataset.siteId = "107";
            rybbitScript.setAttribute("defer", "true");
            document.head.appendChild(rybbitScript);
        }

        if (isSpam) {
            console.warn("Spam referrer blocked:", referrer);
        }
    </script>
</head>

<body>
    <a href="#main-content" class="wc-skip-link" data-i18n="common.skipToContent">Skip to main content</a>
    <main id="main-content" class="wc-stage wc-stage--transient">
        <div class="wc-frame">
            <div class="wc-frame-head">
                <span class="wc-lockup">Wildcat<b>Sage</b></span>
                <span class="wc-readout wc-readout--accent" id="status-readout">
                    <span class="wc-dot"></span><span data-i18n="page.working">Working</span>
                </span>
            </div>

            <div class="wc-frame-body">
                <h1 class="wc-title wc-title--sm" id="auth-title" data-i18n="page.title">Signing you in</h1>
                <p class="wc-lede" id="auth-message" role="status" aria-live="polite" data-i18n="page.pleaseWait">Please wait.</p>

                <ol class="wc-steps" id="auth-steps">
                    <li class="wc-step" data-step="authorized" data-i18n="page.stepAuthorized">Twitch authorized</li>
                    <li class="wc-step" data-step="token" data-i18n="page.stepToken">Session token stored</li>
                    <li class="wc-step" data-step="redirect" data-i18n="page.stepRedirect">Opening dashboard</li>
                </ol>

                <!-- Determinate: driven by the three real steps below, not a timer. -->
                <div class="wc-bar" id="auth-bar" role="progressbar" aria-label="Sign-in progress" data-i18n-aria-label="page.progressLabel"><span></span></div>
            </div>

            <div class="wc-frame-foot">
                <span id="session-state" data-i18n="page.establishingSession">Establishing session</span>
                <span>bot.wildcat.chat</span>
            </div>
        </div>
    </main>

    <script type="module">
        import { t, initI18n } from '/js/i18n.js';

        document.addEventListener('DOMContentLoaded', async () => {
            // Catalog first: this script writes final status text, so translating afterwards
            // would overwrite it with the markup defaults.
            await initI18n();

            const messageEl = document.getElementById('auth-message');
            const titleEl = document.getElementById('auth-title');
            const readoutEl = document.getElementById('status-readout');
            const sessionStateEl = document.getElementById('session-state');
            const barEl = document.getElementById('auth-bar');

            // The three steps are real and discrete, so the bar reports actual
            // completion here instead of looping. It only ever advances on a
            // step that genuinely happened.
            function markStep(name) {
                const el = document.querySelector(`.wc-step[data-step="${name}"]`);
                if (el) el.classList.add('is-done');

                const steps = document.querySelectorAll('.wc-step');
                const done = document.querySelectorAll('.wc-step.is-done').length;
                const fill = barEl && barEl.querySelector('span');
                if (!fill || !steps.length) return;

                const pct = Math.round((done / steps.length) * 100);
                barEl.setAttribute('data-progress', String(pct));
                barEl.setAttribute('aria-valuemin', '0');
                barEl.setAttribute('aria-valuemax', '100');
                barEl.setAttribute('aria-valuenow', String(pct));
                fill.style.width = pct + '%';
            }

            function fail(message) {
                titleEl.textContent = t('page.failedTitle', {}, 'Sign-in failed');
                messageEl.textContent = message;
                readoutEl.textContent = t('page.failedReadout', {}, 'Failed');
                readoutEl.classList.remove('wc-readout--accent');
                readoutEl.classList.add('wc-readout--danger');
                sessionStateEl.textContent = t('page.noSession', {}, 'No session');
                barEl.remove();
            }

            const queryParams = new URLSearchParams(window.location.search);

            const userLogin = queryParams.get('user_login');
            const userId = queryParams.get('user_id');

            // Both handed over in memory by the head script, which already took
            // them out of the URL; the query reads only cover that script not
            // having run. `__sessionToken` is the old shape, still accepted for
            // anyone mid-flow across the deploy.
            const exchangeCode = window.__exchangeCode || queryParams.get('code');
            const legacyToken = window.__sessionToken || queryParams.get('session_token');

            // Nothing below needs them on the global object.
            delete window.__exchangeCode;
            delete window.__sessionToken;

            // The server compares the `state` it receives from Twitch against a
            // one-use HttpOnly cookie and rejects the callback before minting a
            // token, so reaching this page means state binding already passed.
            console.log("Processing authentication for user:", userLogin);

            /**
             * Trades the one-time code for the session token.
             */
            async function redeemCode(code) {
                // Relative on purpose: this page is served from the same host
                // that rewrites /auth/** to the function, so the exchange is
                // same-origin and needs no CORS.
                const response = await fetch('/auth/exchange', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ code })
                });

                const data = await response.json().catch(() => ({}));
                if (!response.ok || !data.success || !data.session_token) {
                    // data.message is server-authored and still English (see the plan's
                    // out-of-scope note on the API message catalog).
                    throw new Error(data.message || t('page.signInFailed', {}, 'Sign-in failed.'));
                }
                return data.session_token;
            }

            /**
             * Stores the session and moves the user on to the dashboard.
             */
            function completeSignIn(sessionToken) {
                localStorage.setItem('twitch_user_login', userLogin);
                localStorage.setItem('twitch_user_id', userId);
                localStorage.setItem('app_session_token', sessionToken);

                markStep('token');
                sessionStateEl.textContent = t('page.sessionEstablished', {}, 'Session established');

                titleEl.textContent = t('page.welcome', { user: userLogin }, `Welcome, ${userLogin}`);
                messageEl.textContent = t('page.openingDashboard', {}, 'Opening your dashboard.');
                markStep('redirect');

                setTimeout(() => {
                    window.location.href = 'dashboard.html';
                }, 1000);
            }

            if (userLogin && userId && (exchangeCode || legacyToken)) {
                markStep('authorized');

                if (exchangeCode) {
                    // A code is single-use, so a failure here cannot be retried
                    // by reloading — send the user back to sign in again.
                    redeemCode(exchangeCode)
                        .then(completeSignIn)
                        .catch((error) => {
                            console.error('Exchange failed:', error);
                            fail(t('page.signInAgain', { message: error.message }, `${error.message} Sign in again.`));
                            if (!window.location.search.includes('disable_redirect=true') && !window.location.search.includes('dev=true')) {
                                setTimeout(() => {
                                    window.location.href = 'index.html';
                                }, 4000);
                            }
                        });
                } else {
                    completeSignIn(legacyToken);
                }
            } else {
                console.error("Missing required parameters:", { userLogin, userId, code: exchangeCode ? 'present' : 'missing' });
                fail(t('page.missingData', {}, 'Authentication data is missing from the Twitch response. Sign in again.'));
                if (!window.location.search.includes('disable_redirect=true') && !window.location.search.includes('dev=true')) {
                    setTimeout(() => {
                        window.location.href = 'index.html';
                    }, 3000);
                }
            }
        });
    </script>
</body>

</html>

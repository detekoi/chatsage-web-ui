<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WildcatSage - Completing sign in</title>

    <link rel="icon" href="/favicon.ico" sizes="any">
    <link rel="apple-touch-icon" href="/logo192.png">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600&family=Public+Sans:wght@400;600&family=DM+Mono:wght@400;500&display=swap"
        rel="stylesheet">

    <!-- Custom overrides -->
    <link rel="stylesheet" href="styles/reset.css">
    <link rel="stylesheet" href="styles/design-system.css">

    <!-- Apply theme early to prevent flash -->
    <script>
        (function () {
            const theme = localStorage.getItem('chatsage-theme') ||
                (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
            if (theme === 'dark') {
                document.documentElement.setAttribute('data-theme', 'dark');
            }
        })();
    </script>

    <script>
        // Spam domain blocker
        const spamDomains = [
            "sigr.io",
            "semalt.com",
            "buttons-for-website.com",
            "4webmasters.org",
        ];

        const referrer = document.referrer;
        let isSpam = false;

        for (const spamDomain of spamDomains) {
            if (referrer.includes(spamDomain)) {
                isSpam = true;
                break;
            }
        }

        if (!isSpam) {
            const rybbitScript = document.createElement("script");
            rybbitScript.src = "https://app.rybbit.io/api/script.js";
            rybbitScript.dataset.siteId = "107";
            rybbitScript.setAttribute("defer", "true");
            document.head.appendChild(rybbitScript);
        }

        if (isSpam) {
            console.warn("Spam referrer blocked:", referrer);
        }
    </script>
</head>

<body>
    <main class="wc-stage wc-stage--transient">
        <div class="wc-frame">
            <div class="wc-frame-head">
                <span class="wc-lockup">Wildcat<b>Sage</b></span>
                <span class="wc-readout wc-readout--accent" id="status-readout">
                    <span class="wc-dot"></span>Working
                </span>
            </div>

            <div class="wc-frame-body">
                <h1 class="wc-title wc-title--sm" id="auth-title">Signing you in</h1>
                <p class="wc-lede" id="auth-message" role="status" aria-live="polite">Please wait.</p>

                <ol class="wc-steps" id="auth-steps">
                    <li class="wc-step" data-step="authorized">Twitch authorized</li>
                    <li class="wc-step" data-step="token">Session token stored</li>
                    <li class="wc-step" data-step="redirect">Loading dashboard</li>
                </ol>

                <!-- Determinate: driven by the three real steps below, not a timer. -->
                <div class="wc-bar" id="auth-bar" role="progressbar" aria-label="Sign-in progress"><span></span></div>
            </div>

            <div class="wc-frame-foot">
                <span id="session-state">Establishing session</span>
                <span>bot.wildcat.chat</span>
            </div>
        </div>
    </main>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const messageEl = document.getElementById('auth-message');
            const titleEl = document.getElementById('auth-title');
            const readoutEl = document.getElementById('status-readout');
            const sessionStateEl = document.getElementById('session-state');
            const barEl = document.getElementById('auth-bar');

            // The three steps are real and discrete, so the bar reports actual
            // completion here instead of looping. It only ever advances on a
            // step that genuinely happened.
            function markStep(name) {
                const el = document.querySelector(`.wc-step[data-step="${name}"]`);
                if (el) el.classList.add('is-done');

                const steps = document.querySelectorAll('.wc-step');
                const done = document.querySelectorAll('.wc-step.is-done').length;
                const fill = barEl && barEl.querySelector('span');
                if (!fill || !steps.length) return;

                const pct = Math.round((done / steps.length) * 100);
                barEl.setAttribute('data-progress', String(pct));
                barEl.setAttribute('aria-valuemin', '0');
                barEl.setAttribute('aria-valuemax', '100');
                barEl.setAttribute('aria-valuenow', String(pct));
                fill.style.width = pct + '%';
            }

            function fail(message) {
                titleEl.textContent = 'Sign-in failed';
                messageEl.textContent = message;
                readoutEl.innerHTML = 'Failed';
                readoutEl.classList.remove('wc-readout--accent');
                readoutEl.classList.add('wc-readout--danger');
                sessionStateEl.textContent = 'No session';
                barEl.remove();
            }

            const queryParams = new URLSearchParams(window.location.search);

            const userLogin = queryParams.get('user_login');
            const userId = queryParams.get('user_id');
            const sessionToken = queryParams.get('session_token');

            // Server has already validated the OAuth state
            console.log("Processing authentication for user:", userLogin);

            if (userLogin && userId && sessionToken) {
                markStep('authorized');

                // Store user info and session token
                localStorage.setItem('twitch_user_login', userLogin);
                localStorage.setItem('twitch_user_id', userId);
                localStorage.setItem('app_session_token', sessionToken);

                console.log("Authentication successful. Session token stored.");
                markStep('token');
                sessionStateEl.textContent = 'Session established';

                titleEl.textContent = `Welcome, ${userLogin}`;
                messageEl.textContent = 'Redirecting to your dashboard.';
                markStep('redirect');

                // Redirect to dashboard after brief delay
                setTimeout(() => {
                    window.location.href = 'dashboard.html';
                }, 1000);
            } else {
                console.error("Missing required parameters:", { userLogin, userId, sessionToken: sessionToken ? 'present' : 'missing' });
                fail("Missing authentication information from the Twitch callback. Please try again.");
                setTimeout(() => {
                    window.location.href = 'index.html';
                }, 3000);
            }
        });
    </script>
</body>

</html>
